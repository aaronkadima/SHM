name: Deploy SHM production + development preview to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Frontend build check","Export browser ONNX models"]
    types: [completed]
    branches: ["dev","main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod-src

      - name: Checkout development source
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: prod-src/frontend
        run: npm ci

      - name: Build production
        working-directory: prod-src/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /SHM/
          VITE_APP_CHANNEL: production
        run: VITE_BUILD_SHA=$(git rev-parse --short HEAD) npm run build

      - name: Install development dependencies
        working-directory: dev-src/frontend
        run: npm ci

      - name: Build development preview
        working-directory: dev-src/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /SHM/dev/
          VITE_APP_CHANNEL: development
        run: VITE_BUILD_SHA=$(git rev-parse --short HEAD) npm run build

      - name: Validate development catalog
        run: |
          DEV_CATALOG="$(node -p "require('./dev-src/frontend/src/engines.json').version")"
          grep -R -q "CDM-1" dev-src/frontend/dist/assets
          grep -R -q "browser-js-cdm-v285" dev-src/frontend/dist/assets
          grep -R -q "development" dev-src/frontend/dist/assets
          grep -R -q "$DEV_CATALOG" dev-src/frontend/dist/assets

      - name: Fetch same-origin browser model assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prod-browser-models dev-browser-models
          if gh release view browser-models-stable --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download browser-models-stable --repo "$GITHUB_REPOSITORY" --pattern "segformer_public_crack.onnx" --pattern "segformer_public_crack.json" --pattern "yolov8n_public_crack_seg.onnx" --pattern "yolov8n_public_crack_seg.json" --pattern "yolov8n_public_crack_seg.parity.png" --pattern "yolov8n_public_crack_seg.parity.json" --pattern "crackenpy_public_crack.int8.onnx" --pattern "crackenpy_public_crack.int8.json" --pattern "crackenpy_public_crack.int8.parity.png" --pattern "crackenpy_public_crack.int8.parity.json" --pattern "crackenpy_public_crack.int8.parity-mask.png" --dir prod-browser-models --clobber
          else
            echo "Stable browser model release not available yet; production assets will be added on the next model workflow completion."
          fi
          if gh release view browser-models-dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download browser-models-dev --repo "$GITHUB_REPOSITORY" --pattern "segformer_public_crack.onnx" --pattern "segformer_public_crack.json" --pattern "yolov8n_public_crack_seg.onnx" --pattern "yolov8n_public_crack_seg.json" --pattern "yolov8n_public_crack_seg.parity.png" --pattern "yolov8n_public_crack_seg.parity.json" --pattern "crackenpy_public_crack.int8.onnx" --pattern "crackenpy_public_crack.int8.json" --pattern "crackenpy_public_crack.int8.parity.png" --pattern "crackenpy_public_crack.int8.parity.json" --pattern "crackenpy_public_crack.int8.parity-mask.png" --dir dev-browser-models --clobber
          else
            echo "Development browser model release not available."
          fi

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/dev site/browser-models site/dev/browser-models
          cp -a prod-src/frontend/dist/. site/
          cp -a dev-src/frontend/dist/. site/dev/
          if compgen -G "prod-browser-models/*" >/dev/null; then cp -a prod-browser-models/. site/browser-models/; fi
          if compgen -G "dev-browser-models/*" >/dev/null; then cp -a dev-browser-models/. site/dev/browser-models/; fi
          PROD_SHA="$(git -C prod-src rev-parse --short HEAD)"
          DEV_SHA="$(git -C dev-src rev-parse --short HEAD)"
          PROD_CATALOG="$(node -p "require('./prod-src/frontend/src/engines.json').version")"
          DEV_CATALOG="$(node -p "require('./dev-src/frontend/src/engines.json').version")"
          printf '%s\n' 'SHM production: main' > site/DEPLOYMENT.txt
          printf '%s\n' 'SHM development: dev' > site/dev/DEPLOYMENT.txt
          printf '{"channel":"production","branch":"main","sha":"%s","catalogVersion":"%s"}\n' "$PROD_SHA" "$PROD_CATALOG" > site/build.json
          printf '{"channel":"development","branch":"dev","sha":"%s","catalogVersion":"%s"}\n' "$DEV_SHA" "$DEV_CATALOG" > site/dev/build.json
          node -e "const fs=require('fs');for(const p of ['site/build.json','site/dev/build.json']){const x=JSON.parse(fs.readFileSync(p,'utf8'));if(!x.sha||!x.catalogVersion)throw new Error('Invalid build manifest: '+p)}"

      - name: Validate production and development routes
        run: |
          test -f site/index.html
          test -f site/dev/index.html
          PROD_SHA="$(node -p "require('./site/build.json').sha")"
          DEV_SHA="$(node -p "require('./site/dev/build.json').sha")"
          grep -R -q "$PROD_SHA" prod-src/frontend/dist/assets
          grep -R -q "$DEV_SHA" dev-src/frontend/dist/assets
          grep -q "/SHM/assets/" site/index.html
          grep -q "/SHM/dev/assets/" site/dev/index.html
          test "$(node -p "require('./site/build.json').branch")" = "main"
          test "$(node -p "require('./site/dev/build.json').branch")" = "dev"
          test -f site/ort/ort-wasm-simd-threaded.wasm
          test -f site/ort/ort-wasm-simd-threaded.mjs
          test -f site/ort/ort-wasm-simd-threaded.jsep.wasm
          test -f site/ort/ort-wasm-simd-threaded.jsep.mjs
          test -f site/dev/ort/ort-wasm-simd-threaded.wasm
          test -f site/dev/ort/ort-wasm-simd-threaded.mjs
          test -f site/dev/ort/ort-wasm-simd-threaded.jsep.wasm
          test -f site/dev/ort/ort-wasm-simd-threaded.jsep.mjs
          # Browser-ready neural engines are mandatory deployment assets.
          test -s site/browser-models/segformer_public_crack.onnx
          test -s site/browser-models/segformer_public_crack.json
          test -s site/browser-models/yolov8n_public_crack_seg.onnx
          test -s site/browser-models/yolov8n_public_crack_seg.json
          test -s site/browser-models/yolov8n_public_crack_seg.parity.png
          test -s site/browser-models/yolov8n_public_crack_seg.parity.json
          test -s site/browser-models/crackenpy_public_crack.int8.onnx
          test -s site/browser-models/crackenpy_public_crack.int8.json
          test -s site/browser-models/crackenpy_public_crack.int8.parity.png
          test -s site/browser-models/crackenpy_public_crack.int8.parity.json
          test -s site/browser-models/crackenpy_public_crack.int8.parity-mask.png
          test -s site/dev/browser-models/segformer_public_crack.onnx
          test -s site/dev/browser-models/segformer_public_crack.json
          test -s site/dev/browser-models/yolov8n_public_crack_seg.onnx
          test -s site/dev/browser-models/yolov8n_public_crack_seg.json
          test -s site/dev/browser-models/yolov8n_public_crack_seg.parity.png
          test -s site/dev/browser-models/yolov8n_public_crack_seg.parity.json
          test -s site/dev/browser-models/crackenpy_public_crack.int8.onnx
          test -s site/dev/browser-models/crackenpy_public_crack.int8.json
          test -s site/dev/browser-models/crackenpy_public_crack.int8.parity.png
          test -s site/dev/browser-models/crackenpy_public_crack.int8.parity.json
          test -s site/dev/browser-models/crackenpy_public_crack.int8.parity-mask.png
          node - <<'NODE'
          const fs=require("fs");
          const checks=[
            ["site/browser-models/segformer_public_crack.json","segformer_public_crack"],
            ["site/browser-models/yolov8n_public_crack_seg.json","yolov8n_public_crack_seg"],
            ["site/browser-models/crackenpy_public_crack.int8.json","crackenpy_public_crack"],
            ["site/dev/browser-models/segformer_public_crack.json","segformer_public_crack"],
            ["site/dev/browser-models/yolov8n_public_crack_seg.json","yolov8n_public_crack_seg"],
            ["site/dev/browser-models/crackenpy_public_crack.int8.json","crackenpy_public_crack"]
          ];
          for(const [file,id] of checks){
            const m=JSON.parse(fs.readFileSync(file,"utf8"));
            if(m.engine_id!==id)throw new Error(file+" engine_id="+m.engine_id+" expected "+id);
            if(!/^[0-9a-f]{64}$/i.test(String(m.sha256||"")))throw new Error(file+" invalid sha256");
            if(!(Number(m.bytes)>0))throw new Error(file+" invalid bytes");
          }
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke deployed browser engines
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout smoke runner
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for published production build
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse --short HEAD)"
          READY=0
          for i in $(seq 1 40); do
            BODY="$(curl -fsS "https://aaronkadima.github.io/SHM/build.json?ts=$(date +%s%N)" || true)"
            SHA="$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).sha||""))}catch{}})')"
            if [ "$SHA" = "$EXPECTED" ]; then
              READY=1
              break
            fi
            echo "Published SHA=$SHA; waiting for $EXPECTED"
            sleep 3
          done
          if [ "$READY" -ne 1 ]; then
            echo "Production build.json did not converge to $EXPECTED"
            exit 1
          fi

      - name: Resolve Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi
          echo "bin=$CHROME" >> "$GITHUB_OUTPUT"

      - name: PROD · YOLOv8n · mobile full-app smoke
        working-directory: frontend
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
          APP_SMOKE_URL: https://aaronkadima.github.io/SHM/#/analysis
          APP_SMOKE_FIXTURE: https://aaronkadima.github.io/SHM/browser-models/yolov8n_public_crack_seg.parity.png
          APP_SMOKE_ENGINE: yolov8n_public_crack_seg
          APP_SMOKE_WINDOW_SIZE: 412,915
          APP_SMOKE_DEBUG_PORT: "9241"
          APP_SMOKE_TIMEOUT_MS: "180000"
        run: node scripts/run-app-browser-engine-smoke.mjs

      - name: DEV · YOLOv8n · mobile full-app smoke
        working-directory: frontend
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
          APP_SMOKE_URL: https://aaronkadima.github.io/SHM/dev/#/analysis
          APP_SMOKE_FIXTURE: https://aaronkadima.github.io/SHM/dev/browser-models/yolov8n_public_crack_seg.parity.png
          APP_SMOKE_ENGINE: yolov8n_public_crack_seg
          APP_SMOKE_WINDOW_SIZE: 412,915
          APP_SMOKE_DEBUG_PORT: "9242"
          APP_SMOKE_TIMEOUT_MS: "180000"
        run: node scripts/run-app-browser-engine-smoke.mjs

      - name: PROD · CrackenPy · mobile full-app smoke
        working-directory: frontend
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
          APP_SMOKE_URL: https://aaronkadima.github.io/SHM/#/analysis
          APP_SMOKE_FIXTURE: https://aaronkadima.github.io/SHM/browser-models/crackenpy_public_crack.int8.parity.png
          APP_SMOKE_ENGINE: crackenpy_public_crack
          APP_SMOKE_WINDOW_SIZE: 412,915
          APP_SMOKE_DEBUG_PORT: "9243"
          APP_SMOKE_TIMEOUT_MS: "180000"
        run: node scripts/run-app-browser-engine-smoke.mjs

      - name: DEV · SegFormer · mobile full-app smoke
        working-directory: frontend
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
          APP_SMOKE_URL: https://aaronkadima.github.io/SHM/dev/#/analysis
          APP_SMOKE_FIXTURE: https://aaronkadima.github.io/SHM/dev/browser-models/yolov8n_public_crack_seg.parity.png
          APP_SMOKE_ENGINE: segformer_public_crack
          APP_SMOKE_WINDOW_SIZE: 412,915
          APP_SMOKE_DEBUG_PORT: "9244"
          APP_SMOKE_TIMEOUT_MS: "180000"
        run: node scripts/run-app-browser-engine-smoke.mjs
