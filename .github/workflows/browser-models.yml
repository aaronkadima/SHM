name: Export browser ONNX models

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Compact SHM engine to export
        required: true
        default: all
        type: choice
        options:
          - all
          - yolov8n_public_crack_seg
          - unet_public_crack
          - segformer_public_crack
  push:
    branches: ["main","dev"]
    paths:
      - ".github/workflows/browser-models.yml"
      - "tools/export_browser_models.py"
      - "tools/validate_browser_model.py"
      - "tools/generate_yolo_browser_parity.py"
      - "tools/requirements-browser-export.txt"

permissions:
  contents: write

concurrency:
  group: browser-models-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      REQUESTED_ENGINE: ${{ github.event_name == 'workflow_dispatch' && inputs.engine || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tools/requirements-browser-export.txt

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install ONNX export dependencies
        run: pip install -r tools/requirements-browser-export.txt

      - name: Resolve engine set
        id: engines
        shell: bash
        run: |
          if [ "$REQUESTED_ENGINE" = "all" ]; then
            ENGINES="yolov8n_public_crack_seg unet_public_crack segformer_public_crack"
          else
            ENGINES="$REQUESTED_ENGINE"
          fi
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"

      - name: Export and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-models/release
          for ENGINE in ${{ steps.engines.outputs.engines }}; do
            echo "::group::Export $ENGINE"
            python tools/export_browser_models.py --engine "$ENGINE"
            python tools/validate_browser_model.py --engine "$ENGINE"
            cp "browser-models/artifacts/$ENGINE/model.onnx" "browser-models/release/$ENGINE.onnx"
            cp "browser-models/artifacts/$ENGINE/manifest.json" "browser-models/release/$ENGINE.json"
            if [ "$ENGINE" = "yolov8n_public_crack_seg" ]; then
              python tools/generate_yolo_browser_parity.py --out-dir "browser-models/artifacts/$ENGINE"
              cp "browser-models/artifacts/$ENGINE/parity.png" "browser-models/release/$ENGINE.parity.png"
              cp "browser-models/artifacts/$ENGINE/parity.json" "browser-models/release/$ENGINE.parity.json"
            fi
            echo "::endgroup::"
          done
          ls -lh browser-models/release

      - name: Upload validated bundle
        uses: actions/upload-artifact@v4
        with:
          name: shm-browser-models-${{ github.ref_name }}
          path: browser-models/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish repository release assets
        if: github.ref_name == 'dev' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            TAG="browser-models-dev"
            TITLE="SHM browser models · development"
            EXTRA="--prerelease"
          else
            TAG="browser-models-stable"
            TITLE="SHM browser models · stable"
            EXTRA=""
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "Validated ONNX assets for SHM browser inference. Assets are generated from the public checkpoints declared in engines/catalog.json." $EXTRA
          fi
          gh release upload "$TAG" browser-models/release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets
