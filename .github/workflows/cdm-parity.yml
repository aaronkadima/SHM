name: CDM Python-browser parity

on:
  pull_request:
    paths:
      - "backend/app/cdm_v285.py"
      - "backend/app/adapters/cdm_adapter.py"
      - "backend/tests/generate_cdm_parity_fixture.py"
      - "frontend/src/cdmBrowser.js"
      - "frontend/src/cdmWorker.js"
      - "frontend/scripts/check-cdm-parity.mjs"
      - ".github/workflows/cdm-parity.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/app/cdm_v285.py"
      - "backend/app/adapters/cdm_adapter.py"
      - "backend/tests/generate_cdm_parity_fixture.py"
      - "frontend/src/cdmBrowser.js"
      - "frontend/src/cdmWorker.js"
      - "frontend/scripts/check-cdm-parity.mjs"
      - ".github/workflows/cdm-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CDM parity dependencies
        run: python -m pip install "numpy==2.1.3" "pillow==11.1.0" "lxml>=5,<7" "scipy>=1.14,<2"

      - name: Generate Python reference fixture
        run: python backend/tests/generate_cdm_parity_fixture.py /tmp/cdm-parity.json

      - name: Compare browser implementation
        run: node frontend/scripts/check-cdm-parity.mjs /tmp/cdm-parity.json
