name: Deploy SHM production + development preview to GitHub Pages

on:
  push:
    branches: ["main","feat/cdm-1"]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod-src

      - name: Checkout development source
        uses: actions/checkout@v6
        with:
          ref: feat/cdm-1
          path: dev-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: prod-src/frontend
        run: npm install

      - name: Build production
        working-directory: prod-src/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /SHM/
          VITE_APP_CHANNEL: production
        run: VITE_BUILD_SHA=$(git rev-parse --short HEAD) npm run build

      - name: Install development dependencies
        working-directory: dev-src/frontend
        run: npm install

      - name: Build development preview
        working-directory: dev-src/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /SHM/dev/
          VITE_APP_CHANNEL: development
        run: VITE_BUILD_SHA=$(git rev-parse --short HEAD) npm run build

      - name: Validate development catalog
        run: |
          grep -R -q "CDM-1" dev-src/frontend/dist/assets
          grep -R -q "browser-js-cdm-v285" dev-src/frontend/dist/assets
          grep -R -q "development" dev-src/frontend/dist/assets
          grep -R -q "1.2.0" dev-src/frontend/dist/assets

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/dev
          cp -a prod-src/frontend/dist/. site/
          cp -a dev-src/frontend/dist/. site/dev/
          PROD_SHA="$(git -C prod-src rev-parse --short HEAD)"
          DEV_SHA="$(git -C dev-src rev-parse --short HEAD)"
          PROD_CATALOG="$(node -p "require('./prod-src/frontend/src/engines.json').version")"
          DEV_CATALOG="$(node -p "require('./dev-src/frontend/src/engines.json').version")"
          printf '%s\n' 'SHM production: main' > site/DEPLOYMENT.txt
          printf '%s\n' 'SHM development: feat/cdm-1' > site/dev/DEPLOYMENT.txt
          printf '{"channel":"production","branch":"main","sha":"%s","catalogVersion":"%s"}\n' "$PROD_SHA" "$PROD_CATALOG" > site/build.json
          printf '{"channel":"development","branch":"feat/cdm-1","sha":"%s","catalogVersion":"%s"}\n' "$DEV_SHA" "$DEV_CATALOG" > site/dev/build.json
          node -e "const fs=require('fs');for(const p of ['site/build.json','site/dev/build.json']){const x=JSON.parse(fs.readFileSync(p,'utf8'));if(!x.sha||!x.catalogVersion)throw new Error('Invalid build manifest: '+p)}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'github-pages-dev' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
