name: Frontend build check

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Engine catalog
        working-directory: frontend
        run: node scripts/check-engine-catalog.mjs

      - name: Campaign chain audit
        working-directory: frontend
        run: node scripts/check-campaign-audit.mjs

      - name: File integrity helper
        working-directory: frontend
        run: node scripts/check-file-integrity.mjs

      - name: Analysis viewer composition
        working-directory: frontend
        run: node scripts/check-analysis-viewer.mjs

      - name: Build
        working-directory: frontend
        run: npm run build
