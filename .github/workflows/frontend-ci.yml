name: Frontend build check

on:
  push:
    branches: ["main","dev"]
    paths:
      - "frontend/**"
      - "engines/catalog.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "engines/catalog.json"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Engine catalog
        working-directory: frontend
        run: node scripts/check-engine-catalog.mjs

      - name: Campaign chain audit
        working-directory: frontend
        run: node scripts/check-campaign-audit.mjs

      - name: File integrity helper
        working-directory: frontend
        run: node scripts/check-file-integrity.mjs

      - name: Analysis viewer composition
        working-directory: frontend
        run: node scripts/check-analysis-viewer.mjs

      - name: Asset detection
        working-directory: frontend
        run: node scripts/check-asset-detection.mjs

      - name: CDM-3 spatial ingestion
        working-directory: frontend
        run: node scripts/check-cdm3-spatial.mjs

      - name: CDM-3 registered RGB projection
        working-directory: frontend
        run: node scripts/check-cdm3-registration.mjs

      - name: CDM-3 photometric fusion
        working-directory: frontend
        run: node scripts/check-cdm3-photometric.mjs

      - name: 3D model asset validation
        working-directory: frontend
        run: node scripts/check-model-asset-validation.mjs

      - name: Viewer preferences
        working-directory: frontend
        run: node scripts/check-viewer-preferences.mjs

      - name: Execution configuration
        working-directory: frontend
        run: node scripts/check-execution-config.mjs

      - name: Result export
        working-directory: frontend
        run: node scripts/check-result-export.mjs

      - name: Browser networking and result reveal
        working-directory: frontend
        run: node scripts/check-browser-networking.mjs

      - name: SegFormer browser ONNX smoke
        working-directory: frontend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="browser-models-dev"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="browser-models-stable"; fi
          node scripts/fetch-browser-model-assets.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --engine segformer_public_crack --dir public/browser-models
          VITE_BASE_PATH=/ VITE_APP_CHANNEL=development npm run dev -- --host 127.0.0.1 --port 4177 > /tmp/shm-onnx-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4177/e2e/browser-onnx-smoke.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shm-onnx-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          CHROME_BIN="$CHROME" \
          SMOKE_URL="http://127.0.0.1:4177/e2e/browser-onnx-smoke.html" \
          SMOKE_TIMEOUT_MS=180000 \
          node scripts/run-browser-onnx-smoke.mjs || {
            cat /tmp/shm-onnx-vite.log
            exit 1
          }

      - name: YOLOv8n browser ONNX candidate smoke
        working-directory: frontend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="browser-models-dev"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="browser-models-stable"; fi
          node scripts/fetch-browser-model-assets.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --engine yolov8n_public_crack_seg --parity --dir public/browser-models
          VITE_BASE_PATH=/ VITE_APP_CHANNEL=development npm run dev -- --host 127.0.0.1 --port 4178 > /tmp/shm-yolo-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4178/e2e/browser-yolo-smoke.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shm-yolo-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          CHROME_BIN="$CHROME" \
          SMOKE_URL="http://127.0.0.1:4178/e2e/browser-yolo-smoke.html" \
          SMOKE_TIMEOUT_MS=180000 \
          SMOKE_DEBUG_PORT=9228 \
          SMOKE_PASS_TOKEN="BROWSER_YOLO_SMOKE_PASS" \
          SMOKE_FAIL_TOKEN="BROWSER_YOLO_SMOKE_FAIL" \
          node scripts/run-browser-onnx-smoke.mjs || {
            cat /tmp/shm-yolo-vite.log
            exit 1
          }

      - name: U-Net INT8 browser ONNX candidate smoke
        working-directory: frontend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="browser-models-dev"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="browser-models-stable"; fi
          node scripts/fetch-browser-model-assets.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --engine unet_public_crack --variant int8 --parity --dir public/browser-models
          VITE_BASE_PATH=/ VITE_APP_CHANNEL=development npm run dev -- --host 127.0.0.1 --port 4179 > /tmp/shm-unet-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4179/e2e/browser-unet-smoke.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shm-unet-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          CHROME_BIN="$CHROME" \
          SMOKE_URL="http://127.0.0.1:4179/e2e/browser-unet-smoke.html" \
          SMOKE_TIMEOUT_MS=180000 \
          SMOKE_DEBUG_PORT=9229 \
          SMOKE_PASS_TOKEN="BROWSER_UNET_SMOKE_PASS" \
          SMOKE_FAIL_TOKEN="BROWSER_UNET_SMOKE_FAIL" \
          node scripts/run-browser-onnx-smoke.mjs || {
            cat /tmp/shm-unet-vite.log
            exit 1
          }

      - name: CrackenPy INT8 browser ONNX candidate smoke
        working-directory: frontend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="browser-models-dev"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="browser-models-stable"; fi
          node scripts/fetch-browser-model-assets.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --engine crackenpy_public_crack --variant int8 --parity --reference-mask --dir public/browser-models
          VITE_BASE_PATH=/ VITE_APP_CHANNEL=development npm run dev -- --host 127.0.0.1 --port 4180 > /tmp/shm-crackenpy-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4180/e2e/browser-crackenpy-smoke.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shm-crackenpy-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          CHROME_BIN="$CHROME" \
          SMOKE_URL="http://127.0.0.1:4180/e2e/browser-crackenpy-smoke.html" \
          SMOKE_TIMEOUT_MS=180000 \
          SMOKE_DEBUG_PORT=9230 \
          SMOKE_PASS_TOKEN="BROWSER_CRACKENPY_SMOKE_PASS" \
          SMOKE_FAIL_TOKEN="BROWSER_CRACKENPY_SMOKE_FAIL" \
          node scripts/run-browser-onnx-smoke.mjs || {
            cat /tmp/shm-crackenpy-vite.log
            exit 1
          }

      - name: Full application browser-engine result smoke
        working-directory: frontend
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="browser-models-dev"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG="browser-models-stable"; fi
          node scripts/fetch-browser-model-assets.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --engine segformer_public_crack --dir public/browser-models
          node scripts/fetch-browser-model-assets.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --engine yolov8n_public_crack_seg --parity --dir public/browser-models
          node scripts/fetch-browser-model-assets.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --engine crackenpy_public_crack --variant int8 --parity --reference-mask --dir public/browser-models
          CATALOG_VERSION="$(node -p "require('./src/engines.json').version")"
          printf '{"channel":"development","branch":"dev","sha":"app-smoke","catalogVersion":"%s"}\n' "$CATALOG_VERSION" > public/build.json

          VITE_BASE_PATH=/ VITE_APP_CHANNEL=development VITE_BUILD_SHA=app-smoke npm run dev -- --host 127.0.0.1 --port 4181 > /tmp/shm-app-browser-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4181/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shm-app-browser-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          run_app_smoke () {
            local engine="$1"
            local fixture="$2"
            local port="$3"
            echo "::group::Full app browser result · $engine"
            CHROME_BIN="$CHROME" \
            APP_SMOKE_URL="http://127.0.0.1:4181/#/analysis" \
            APP_SMOKE_ENGINE="$engine" \
            APP_SMOKE_FIXTURE="$fixture" \
            APP_SMOKE_TIMEOUT_MS=180000 \
            APP_SMOKE_DEBUG_PORT="$port" \
            node scripts/run-app-browser-engine-smoke.mjs
            echo "::endgroup::"
          }

          run_app_smoke "yolov8n_public_crack_seg" "/browser-models/yolov8n_public_crack_seg.parity.png" 9231
          run_app_smoke "segformer_public_crack" "/browser-models/yolov8n_public_crack_seg.parity.png" 9232
          run_app_smoke "crackenpy_public_crack" "/browser-models/crackenpy_public_crack.int8.parity.png" 9233
          run_app_smoke "cdm_3" "/browser-models/yolov8n_public_crack_seg.parity.png" 9234
          echo "::group::Full app CDM-3 spatial result"
          CHROME_BIN="$CHROME" \
          APP_SMOKE_URL="http://127.0.0.1:4181/#/analysis" \
          APP_SMOKE_DEBUG_PORT=9235 \
          node scripts/run-app-cdm3-spatial-smoke.mjs
          echo "::endgroup::"
          echo "::group::Full app CDM-3 external RGB registration"
          CHROME_BIN="$CHROME" \
          APP_SMOKE_URL="http://127.0.0.1:4181/#/analysis" \
          APP_SMOKE_DEBUG_PORT=9236 \
          node scripts/run-app-cdm3-rgb-registration-smoke.mjs
          echo "::endgroup::"

      - name: Browser viewer smoke
        working-directory: frontend
        shell: bash
        run: |
          VITE_BASE_PATH=/ npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/shm-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/e2e/viewer-smoke.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shm-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-chrome-$RANDOM" --window-size=1280,800 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:4173/e2e/viewer-smoke.html > /tmp/shm-viewer-dom.html 2>/tmp/shm-chrome.log || {
              cat /tmp/shm-chrome.log
              exit 1
            }

          if ! grep -q "VIEWER_SMOKE_PASS" /tmp/shm-viewer-dom.html; then
            cat /tmp/shm-vite.log
            cat /tmp/shm-chrome.log
            cat /tmp/shm-viewer-dom.html
            exit 1
          fi

          grep "VIEWER_SMOKE_PASS" /tmp/shm-viewer-dom.html

      - name: Compact and mobile analysis smoke
        working-directory: frontend
        shell: bash
        run: |
          VITE_BASE_PATH=/ npm run dev -- --host 127.0.0.1 --port 4175 > /tmp/shm-viewer-mobile-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4175/e2e/viewer-smoke.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shm-viewer-mobile-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-viewer-compact-chrome-$RANDOM" --window-size=640,915 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:4175/e2e/viewer-smoke.html > /tmp/shm-viewer-compact-dom.html 2>/tmp/shm-viewer-compact-chrome.log || {
              cat /tmp/shm-viewer-compact-chrome.log
              exit 1
            }

          if ! grep -q "VIEWER_SMOKE_PASS" /tmp/shm-viewer-compact-dom.html; then
            cat /tmp/shm-viewer-mobile-vite.log
            cat /tmp/shm-viewer-compact-chrome.log
            cat /tmp/shm-viewer-compact-dom.html
            exit 1
          fi

          grep "VIEWER_SMOKE_PASS" /tmp/shm-viewer-compact-dom.html

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-viewer-mobile-chrome-$RANDOM" --window-size=412,915 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:4175/e2e/viewer-smoke.html > /tmp/shm-viewer-mobile-dom.html 2>/tmp/shm-viewer-mobile-chrome.log || {
              cat /tmp/shm-viewer-mobile-chrome.log
              exit 1
            }

          if ! grep -q "VIEWER_SMOKE_PASS" /tmp/shm-viewer-mobile-dom.html; then
            cat /tmp/shm-viewer-mobile-vite.log
            cat /tmp/shm-viewer-mobile-chrome.log
            cat /tmp/shm-viewer-mobile-dom.html
            exit 1
          fi

          grep "VIEWER_SMOKE_PASS" /tmp/shm-viewer-mobile-dom.html

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-viewer-phone-chrome-$RANDOM" --window-size=360,800 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:4175/e2e/viewer-smoke.html > /tmp/shm-viewer-phone-dom.html 2>/tmp/shm-viewer-phone-chrome.log || {
              cat /tmp/shm-viewer-phone-chrome.log
              exit 1
            }

          if ! grep -q "VIEWER_SMOKE_PASS" /tmp/shm-viewer-phone-dom.html; then
            cat /tmp/shm-viewer-mobile-vite.log
            cat /tmp/shm-viewer-phone-chrome.log
            cat /tmp/shm-viewer-phone-dom.html
            exit 1
          fi

          grep "VIEWER_SMOKE_PASS" /tmp/shm-viewer-phone-dom.html

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-viewer-mini-chrome-$RANDOM" --window-size=320,568 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:4175/e2e/viewer-smoke.html > /tmp/shm-viewer-mini-dom.html 2>/tmp/shm-viewer-mini-chrome.log || {
              cat /tmp/shm-viewer-mini-chrome.log
              exit 1
            }

          if ! grep -q "VIEWER_SMOKE_PASS" /tmp/shm-viewer-mini-dom.html; then
            cat /tmp/shm-viewer-mobile-vite.log
            cat /tmp/shm-viewer-mini-chrome.log
            cat /tmp/shm-viewer-mini-dom.html
            exit 1
          fi

          grep "VIEWER_SMOKE_PASS" /tmp/shm-viewer-mini-dom.html

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-viewer-landscape-chrome-$RANDOM" --window-size=800,360 --virtual-time-budget=15000 --dump-dom http://127.0.0.1:4175/e2e/viewer-smoke.html > /tmp/shm-viewer-landscape-dom.html 2>/tmp/shm-viewer-landscape-chrome.log || {
              cat /tmp/shm-viewer-landscape-chrome.log
              exit 1
            }

          if ! grep -q "VIEWER_SMOKE_PASS" /tmp/shm-viewer-landscape-dom.html; then
            cat /tmp/shm-viewer-mobile-vite.log
            cat /tmp/shm-viewer-landscape-chrome.log
            cat /tmp/shm-viewer-landscape-dom.html
            exit 1
          fi

          grep "VIEWER_SMOKE_PASS" /tmp/shm-viewer-landscape-dom.html

      - name: Responsive 3D viewer smoke
        working-directory: frontend
        shell: bash
        run: |
          VITE_BASE_PATH=/ npm run dev -- --host 127.0.0.1 --port 4176 > /tmp/shm-model-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4176/e2e/model-smoke.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shm-model-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          for SIZE in 1280,800 412,915 320,568 800,360; do
            TAG="$(echo "$SIZE" | tr ',' 'x')"
            timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-model-$TAG-$RANDOM" --window-size="$SIZE" --virtual-time-budget=12000 --dump-dom http://127.0.0.1:4176/e2e/model-smoke.html > "/tmp/shm-model-$TAG-dom.html" 2>"/tmp/shm-model-$TAG-chrome.log" || {
              cat "/tmp/shm-model-$TAG-chrome.log"
              exit 1
            }
            if ! grep -q "MODEL_SMOKE_PASS" "/tmp/shm-model-$TAG-dom.html"; then
              cat /tmp/shm-model-vite.log
              cat "/tmp/shm-model-$TAG-chrome.log"
              cat "/tmp/shm-model-$TAG-dom.html"
              exit 1
            fi
            grep "MODEL_SMOKE_PASS" "/tmp/shm-model-$TAG-dom.html"
          done

      - name: Mobile settings smoke
        working-directory: frontend
        shell: bash
        run: |
          VITE_BASE_PATH=/ npm run dev -- --host 127.0.0.1 --port 4174 > /tmp/shm-settings-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4174/e2e/settings-mobile-smoke.html >/dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/shm-settings-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner."
            exit 1
          fi

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-settings-chrome-$RANDOM" --window-size=412,915 --virtual-time-budget=12000 --dump-dom http://127.0.0.1:4174/e2e/settings-mobile-smoke.html > /tmp/shm-settings-dom.html 2>/tmp/shm-settings-chrome.log || {
              cat /tmp/shm-settings-chrome.log
              exit 1
            }

          if ! grep -q "SETTINGS_SMOKE_PASS" /tmp/shm-settings-dom.html; then
            cat /tmp/shm-settings-vite.log
            cat /tmp/shm-settings-chrome.log
            cat /tmp/shm-settings-dom.html
            exit 1
          fi

          grep "SETTINGS_SMOKE_PASS" /tmp/shm-settings-dom.html

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-settings-phone-chrome-$RANDOM" --window-size=360,800 --virtual-time-budget=12000 --dump-dom http://127.0.0.1:4174/e2e/settings-mobile-smoke.html > /tmp/shm-settings-phone-dom.html 2>/tmp/shm-settings-phone-chrome.log || {
              cat /tmp/shm-settings-phone-chrome.log
              exit 1
            }

          if ! grep -q "SETTINGS_SMOKE_PASS" /tmp/shm-settings-phone-dom.html; then
            cat /tmp/shm-settings-vite.log
            cat /tmp/shm-settings-phone-chrome.log
            cat /tmp/shm-settings-phone-dom.html
            exit 1
          fi

          grep "SETTINGS_SMOKE_PASS" /tmp/shm-settings-phone-dom.html

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-settings-mini-chrome-$RANDOM" --window-size=320,568 --virtual-time-budget=12000 --dump-dom http://127.0.0.1:4174/e2e/settings-mobile-smoke.html > /tmp/shm-settings-mini-dom.html 2>/tmp/shm-settings-mini-chrome.log || {
              cat /tmp/shm-settings-mini-chrome.log
              exit 1
            }

          if ! grep -q "SETTINGS_SMOKE_PASS" /tmp/shm-settings-mini-dom.html; then
            cat /tmp/shm-settings-vite.log
            cat /tmp/shm-settings-mini-chrome.log
            cat /tmp/shm-settings-mini-dom.html
            exit 1
          fi

          grep "SETTINGS_SMOKE_PASS" /tmp/shm-settings-mini-dom.html

          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --user-data-dir="/tmp/shm-settings-landscape-chrome-$RANDOM" --window-size=800,360 --virtual-time-budget=12000 --dump-dom http://127.0.0.1:4174/e2e/settings-mobile-smoke.html > /tmp/shm-settings-landscape-dom.html 2>/tmp/shm-settings-landscape-chrome.log || {
              cat /tmp/shm-settings-landscape-chrome.log
              exit 1
            }

          if ! grep -q "SETTINGS_SMOKE_PASS" /tmp/shm-settings-landscape-dom.html; then
            cat /tmp/shm-settings-vite.log
            cat /tmp/shm-settings-landscape-chrome.log
            cat /tmp/shm-settings-landscape-dom.html
            exit 1
          fi

          grep "SETTINGS_SMOKE_PASS" /tmp/shm-settings-landscape-dom.html

      - name: Build
        working-directory: frontend
        run: npm run build
