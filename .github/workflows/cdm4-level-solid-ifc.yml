name: CDM-4 level solid IFC check

on:
  push:
    branches: ["dev","main"]
    paths:
      - "backend/app/cdm3/ifc_level_solid.py"
      - "backend/tests/check_cdm4_level_solid_ifc.py"
      - "backend/tests/fixtures/**"
      - ".github/workflows/cdm4-level-solid-ifc.yml"
  pull_request:
    paths:
      - "backend/app/cdm3/ifc_level_solid.py"
      - "backend/tests/check_cdm4_level_solid_ifc.py"
      - "backend/tests/fixtures/**"
      - ".github/workflows/cdm4-level-solid-ifc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level-solid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IFC dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 ifcopenshell==0.8.5
      - name: IFC4 and IFC4.3 damage-shape validation
        working-directory: backend
        run: python tests/check_cdm4_level_solid_ifc.py
