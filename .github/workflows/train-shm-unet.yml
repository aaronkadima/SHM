name: Train SHM compact U-Net

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        required: true
        default: "4"
  push:
    branches: ["dev"]
    paths:
      - "tools/train_shm_unet.py"
      - ".github/workflows/train-shm-unet.yml"

permissions:
  contents: read

concurrency:
  group: train-shm-unet-dev
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EPOCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.epochs || '4' }}
      MAX_PAIRS: "120"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tools/requirements-browser-export.txt

      - name: Install training dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r tools/requirements-browser-export.txt

      - name: Train and evaluate
        run: |
          set -euo pipefail
          python tools/train_shm_unet.py --epochs "$EPOCHS" --max-pairs "$MAX_PAIRS" --out-dir browser-models/artifacts/shm_unet_crack

      - name: Show report summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("browser-models/artifacts/shm_unet_crack/training-report.json")
          d=json.loads(p.read_text())
          print(json.dumps({
            "dataset":d["dataset"],
            "validation":d["validation"],
            "test":d["test"],
            "gate":d["gate"],
            "onnx":d.get("onnx"),
          },indent=2))
          PY

      - name: Upload training artifact
        uses: actions/upload-artifact@v4
        with:
          name: shm-owned-unet-dev
          path: browser-models/artifacts/shm_unet_crack/*
          if-no-files-found: error
          retention-days: 14
