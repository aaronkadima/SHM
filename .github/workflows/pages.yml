name: Deploy SHM production + development preview to GitHub Pages

on:
  push:
    branches: ["main","feat/cdm-1"]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod-src

      - name: Checkout development source
        uses: actions/checkout@v6
        with:
          ref: feat/cdm-1
          path: dev-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: prod-src/frontend
        run: npm install

      - name: Build production
        working-directory: prod-src/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /SHM/
        run: npm run build

      - name: Install development dependencies
        working-directory: dev-src/frontend
        run: npm install

      - name: Build development preview
        working-directory: dev-src/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /SHM/dev/
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/dev
          cp -a prod-src/frontend/dist/. site/
          cp -a dev-src/frontend/dist/. site/dev/
          printf '%s\n' 'SHM production: main' > site/DEPLOYMENT.txt
          printf '%s\n' 'SHM development: feat/cdm-1' > site/dev/DEPLOYMENT.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
