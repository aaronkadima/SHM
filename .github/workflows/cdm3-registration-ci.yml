name: CDM-3 registration check

on:
  push:
    branches: ["dev","main"]
    paths:
      - "backend/app/cdm3/registration.py"
      - "backend/app/cdm3/auto_registration.py"
      - "backend/app/cdm3/api.py"
      - "backend/tests/check_cdm3_registration.py"
      - ".github/workflows/cdm3-registration-ci.yml"
  pull_request:
    paths:
      - "backend/app/cdm3/registration.py"
      - "backend/app/cdm3/auto_registration.py"
      - "backend/app/cdm3/api.py"
      - "backend/tests/check_cdm3_registration.py"
      - ".github/workflows/cdm3-registration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install registration dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 opencv-python-headless==4.10.0.84

      - name: PnP and projection validation
        working-directory: backend
        run: python tests/check_cdm3_registration.py
