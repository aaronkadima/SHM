services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./models:/models"]
    environment:
      MODEL_ROOT: /models
      CORS_ORIGINS: http://localhost:5173
  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
